name: Bug report
description: Report a reproducible Velora problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Velora issue. Reproduction details and Shell logs make fixes much faster.
  - type: input
    id: gnome
    attributes:
      label: GNOME Shell version
      placeholder: "50.x"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: "Example: Ubuntu ..."
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session
      options:
        - Wayland
        - X11
        - Not sure
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Velora revision
      description: Commit SHA if known.
      placeholder: "git rev-parse --short HEAD"
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Enable Velora
        2. Open ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant GNOME Shell logs
      description: "Use: journalctl -f -o cat /usr/bin/gnome-shell | grep -i -E 'velora|liquid glass|liquidglass'"
      render: shell
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recording
      description: Drag files here when the issue is visual.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this on GNOME Shell 50.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
