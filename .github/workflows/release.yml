name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (example: 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version: ${INPUT_VERSION}" >&2
              echo "Expected MAJOR.MINOR.PATCH, for example 0.1.0" >&2
              exit 1
            fi

            TAG="v${INPUT_VERSION}"
            TAG_COMMIT="$(git rev-parse origin/main)"

            if git rev-parse "${TAG}" >/dev/null 2>&1; then
              echo "Tag already exists: ${TAG}" >&2
              exit 1
            fi

            git tag "${TAG}" "${TAG_COMMIT}"
            git push origin "${TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: ${TAG}" >&2
              exit 1
            fi
            TAG_COMMIT="$(git rev-list -n1 "${TAG}")"
          fi

          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "Release tag must point to a commit contained in main." >&2
            exit 1
          fi

          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "TAG_COMMIT=${TAG_COMMIT}" >> "${GITHUB_ENV}"

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          bash -n gnome-shell/install.sh

          python3 - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          extension = root / "gnome-shell" / "velora@wonderer.tech"
          metadata = json.loads((extension / "metadata.json").read_text(encoding="utf-8"))

          required = [
              root / "README.md",
              root / "LICENSE",
              root / "SECURITY.md",
              root / "THIRD_PARTY_NOTICES.md",
              extension / "extension.js",
              extension / "prefs.js",
              extension / "runtime.js",
              extension / "vendor" / "liquid-glass" / "LICENSE",
              extension / "vendor" / "liquid-glass" / "UPSTREAM.md",
              extension / "schemas" / "org.gnome.shell.extensions.velora.gschema.xml",
          ]

          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing release files:\n" + "\n".join(missing))

          if metadata.get("uuid") != "velora@wonderer.tech":
              raise SystemExit("Unexpected extension UUID")

          if "50" not in [str(v) for v in metadata.get("shell-version", [])]:
              raise SystemExit("Release does not declare GNOME Shell 50 support")

          for path in root.rglob("*.xml"):
              ET.parse(path)

          print("Release source validation passed.")
          PY

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          ARCHIVE="velora-desktop-${VERSION}.tar.gz"

          git archive --format=tar.gz --prefix="velora-desktop-${VERSION}/" --output="${ARCHIVE}" "${TAG_COMMIT}"
          sha256sum "${ARCHIVE}" > SHA256SUMS

          {
            echo "## Release artifact"
            echo
            echo "- \`${ARCHIVE}\` — complete Velora source tree for this tag"
            echo "- \`SHA256SUMS\` — SHA-256 checksum"
            echo
            echo "Install after extraction:"
            echo
            echo "\`\`\`bash"
            echo "bash gnome-shell/install.sh"
            echo "\`\`\`"
            echo
            echo "Target: **GNOME Shell 50**"
          } > RELEASE_ARTIFACTS.md

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" -f target_commitish="${TAG_COMMIT}" --jq '.body' > GENERATED_NOTES.md

          {
            cat RELEASE_ARTIFACTS.md
            echo
            echo "---"
            echo
            cat GENERATED_NOTES.md
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" "velora-desktop-${TAG#v}.tar.gz" "SHA256SUMS" --title "Velora Desktop ${TAG}" --notes-file RELEASE_NOTES.md --verify-tag
