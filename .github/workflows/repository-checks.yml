name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check shell script syntax
        run: bash -n gnome-shell/install.sh

      - name: Test performance sampler and runtime packaging
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Check Velora runtime JS syntax and frame budget
        run: |
          find gnome-shell/velora@wonderer.tech -maxdepth 1 -name '*.js' -print0 |
            while IFS= read -r -d '' file; do
              node --input-type=module --check < "$file"
            done
          node tools/test_frame_budget.mjs
          node tools/test_orb_transitions.mjs
          node tools/test_native_dock_autohide.mjs
          node tools/test_native_dock_settings.mjs
          node tools/test_popup_overview_capture.mjs
          node tools/test_calendar_overview_backdrop.mjs
          node tools/test_wallpaper_atmosphere.mjs
          node tools/test_wallpaper_atmosphere_ui.mjs
          node tools/test_preview_glass.mjs
          node tools/test_preview_layout.mjs
          node tools/test_liquid_optics.mjs
          node tools/test_frosted_crystal.mjs
          node tools/test_adaptive_blue_edge.mjs
          # Validate the modified vendored modules as well as Velora's own JS.
          node --input-type=module --check < gnome-shell/velora@wonderer.tech/vendor/liquid-glass/dist/liquidEffect.js
          node --input-type=module --check < gnome-shell/velora@wonderer.tech/vendor/liquid-glass/dist/rendering/material.js

      - name: Validate both GSettings material schemas
        run: |
          glib-compile-schemas --strict --dry-run gnome-shell/velora@wonderer.tech/schemas
          glib-compile-schemas --strict --dry-run gnome-shell/velora@wonderer.tech/vendor/liquid-glass/schemas

      - name: Validate repository metadata and XML
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          ext = root / "gnome-shell" / "velora@wonderer.tech"
          metadata_path = ext / "metadata.json"

          required = [
              root / "README.md",
              root / "LICENSE",
              root / "SECURITY.md",
              root / "CONTRIBUTING.md",
              root / "CODE_OF_CONDUCT.md",
              metadata_path,
              ext / "extension.js",
              ext / "prefs.js",
              ext / "schemas" / "org.gnome.shell.extensions.velora.gschema.xml",
          ]

          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing required files:\n" + "\n".join(missing))

          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          if metadata.get("uuid") != "velora@wonderer.tech":
              raise SystemExit("metadata.json UUID does not match the extension directory")

          shell_versions = [str(v) for v in metadata.get("shell-version", [])]
          if "50" not in shell_versions:
              raise SystemExit("metadata.json must include GNOME Shell 50")

          schema = metadata.get("settings-schema")
          expected_schema = "org.gnome.shell.extensions.velora"
          if schema != expected_schema:
              raise SystemExit(f"Unexpected settings schema: {schema!r}")

          for path in root.rglob("*.xml"):
              ET.parse(path)

          for path in root.rglob("*.svg"):
              ET.parse(path)

          print("Repository metadata/XML/SVG checks passed.")
          PY

      - name: Check for unresolved merge markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' --             ':!gnome-shell/velora@wonderer.tech/vendor/**'; then
            echo "Unresolved merge-conflict marker found."
            exit 1
          fi
