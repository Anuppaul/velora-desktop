<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">GNOME and Velora ownership model</title>
<desc id="desc">GNOME keeps layout, controls, accessibility and animation while Velora owns the visual material layer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0c1222"/>
    <stop offset="1" stop-color="#151d34"/>
  </linearGradient>
  <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4a86cf" stop-opacity=".3"/>
    <stop offset="1" stop-color="#4a86cf" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8a72ff" stop-opacity=".32"/>
    <stop offset="1" stop-color="#50d2ff" stop-opacity=".08"/>
  </linearGradient>
</defs>

<rect width="1200" height="560" rx="34" fill="url(#bg)"/>
<text x="600" y="68" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="34" font-weight="700">One desktop. Clear ownership.</text>
<text x="600" y="102" text-anchor="middle" fill="#aebbd5" font-family="system-ui, sans-serif" font-size="17">Velora enhances native Shell surfaces instead of rebuilding them.</text>

<rect x="70" y="145" width="470" height="320" rx="34" fill="url(#left)" stroke="#78b5ff" stroke-opacity=".45"/>
<rect x="660" y="145" width="470" height="320" rx="34" fill="url(#right)" stroke="#b3a7ff" stroke-opacity=".45"/>

<text x="110" y="198" fill="#8fc5ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">GNOME OWNS</text>
<text x="700" y="198" fill="#c2baff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">VELORA OWNS</text>

<g font-family="system-ui, sans-serif" font-size="19" fill="#eef5ff">
  <text x="110" y="250">✓ Layout &amp; geometry</text>
  <text x="110" y="294">✓ Controls &amp; hit targets</text>
  <text x="110" y="338">✓ Accessibility semantics</text>
  <text x="110" y="382">✓ Native animation</text>
  <text x="110" y="426">✓ Shell interaction behavior</text>

  <text x="700" y="250">✓ Liquid Glass material</text>
  <text x="700" y="294">✓ Blur &amp; refraction</text>
  <text x="700" y="338">✓ Tint &amp; dispersion</text>
  <text x="700" y="382">✓ Rim / specular lighting</text>
  <text x="700" y="426">✓ Orb + Spotlight features</text>
</g>

<g>
  <path d="M540 305 H660" stroke="#9edcff" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="600" cy="305" r="42" fill="#111a31" stroke="#d8f4ff" stroke-opacity=".6"/>
  <text x="600" y="301" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">NATIVE</text>
  <text x="600" y="319" text-anchor="middle" fill="#9edcff" font-family="system-ui, sans-serif" font-size="11">boundary</text>
</g>

<text x="600" y="512" text-anchor="middle" fill="#d9e5fa" font-family="system-ui, sans-serif" font-size="16" font-weight="600">No duplicate Dock • no duplicate Quick Settings • no replacement desktop environment</text>
</svg>