<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Velora contributor path</title>
<desc id="desc">A simple contribution path from choosing an issue through testing and opening a pull request.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/>
    <stop offset="1" stop-color="#151b30"/>
  </linearGradient>
  <linearGradient id="step" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
    <stop offset="1" stop-color="#7f8cff" stop-opacity=".08"/>
  </linearGradient>
</defs>

<rect width="1200" height="430" rx="34" fill="url(#bg)"/>
<text x="600" y="66" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="32" font-weight="700">Contribute to Velora</text>
<text x="600" y="99" text-anchor="middle" fill="#aab8d3" font-family="system-ui, sans-serif" font-size="16">Small, focused changes are the fastest path to a useful merge.</text>

<g stroke="#719cff" stroke-opacity=".55" stroke-width="3">
  <path d="M242 235 H330"/>
  <path d="M462 235 H550"/>
  <path d="M682 235 H770"/>
  <path d="M902 235 H990"/>
</g>

<g font-family="system-ui, sans-serif">
  <g>
    <rect x="70" y="160" width="172" height="150" rx="26" fill="url(#step)" stroke="#fff" stroke-opacity=".2"/>
    <circle cx="156" cy="196" r="20" fill="#4a86cf"/>
    <text x="156" y="202" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">1</text>
    <text x="156" y="243" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Pick an issue</text>
    <text x="156" y="270" text-anchor="middle" fill="#aebbd4" font-size="12">good first issue</text>
    <text x="156" y="288" text-anchor="middle" fill="#aebbd4" font-size="12">or help wanted</text>
  </g>

  <g>
    <rect x="330" y="160" width="172" height="150" rx="26" fill="url(#step)" stroke="#fff" stroke-opacity=".2"/>
    <circle cx="416" cy="196" r="20" fill="#596fe6"/>
    <text x="416" y="202" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">2</text>
    <text x="416" y="243" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Make it focused</text>
    <text x="416" y="270" text-anchor="middle" fill="#aebbd4" font-size="12">one problem</text>
    <text x="416" y="288" text-anchor="middle" fill="#aebbd4" font-size="12">one reviewable change</text>
  </g>

  <g>
    <rect x="550" y="160" width="172" height="150" rx="26" fill="url(#step)" stroke="#fff" stroke-opacity=".2"/>
    <circle cx="636" cy="196" r="20" fill="#7768e8"/>
    <text x="636" y="202" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">3</text>
    <text x="636" y="243" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Test GNOME 50</text>
    <text x="636" y="270" text-anchor="middle" fill="#aebbd4" font-size="12">enable • use</text>
    <text x="636" y="288" text-anchor="middle" fill="#aebbd4" font-size="12">disable • re-enable</text>
  </g>

  <g>
    <rect x="770" y="160" width="172" height="150" rx="26" fill="url(#step)" stroke="#fff" stroke-opacity=".2"/>
    <circle cx="856" cy="196" r="20" fill="#736edb"/>
    <text x="856" y="202" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">4</text>
    <text x="856" y="243" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Attach evidence</text>
    <text x="856" y="270" text-anchor="middle" fill="#aebbd4" font-size="12">logs • screenshot</text>
    <text x="856" y="288" text-anchor="middle" fill="#aebbd4" font-size="12">before / after</text>
  </g>

  <g>
    <rect x="990" y="160" width="140" height="150" rx="26" fill="url(#step)" stroke="#fff" stroke-opacity=".2"/>
    <circle cx="1060" cy="196" r="20" fill="#4d9fd1"/>
    <text x="1060" y="202" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">5</text>
    <text x="1060" y="243" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Open PR</text>
    <text x="1060" y="270" text-anchor="middle" fill="#aebbd4" font-size="12">use the</text>
    <text x="1060" y="288" text-anchor="middle" fill="#aebbd4" font-size="12">review checklist</text>
  </g>
</g>

<text x="600" y="367" text-anchor="middle" fill="#d7e3f7" font-family="system-ui, sans-serif" font-size="15">Preserve native GNOME interaction • keep cleanup safe • avoid unnecessary polling</text>
</svg>